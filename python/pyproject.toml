[project]
name = "webapp-theme-streamlit"
version = "0.1.0"
description = "Shared Streamlit navbar/app-switcher rendering for robertobeanuoc's Streamlit apps (same family as datacarebot-theme's app.css/switcher.js for the Bootstrap apps)."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.42.0",
    "requests>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webapp_theme_streamlit"]
