name: Python tests

# Named distinctly from a hypothetical future "Tests" workflow for the
# static assets (app.css/switcher.js have none today) - only the python/
# subdirectory affects this one, so path-filtered to it.
on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -v
